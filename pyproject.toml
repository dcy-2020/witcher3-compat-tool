[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "witcher3-compat-tool"
version = "0.1.0"
description = "Conservative Witcher 3 5.x compatibility scanner and reversible script-name repair"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "dcy-2020"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: Microsoft :: Windows", "Development Status :: 3 - Alpha"]

[project.scripts]
w3compat = "w3compat.cli:main"

[tool.setuptools.packages.find]
include = ["w3compat*"]
